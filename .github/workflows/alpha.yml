name: MFBS Logic Scanner

on:
  schedule:
    # 06:00 UTC is 11:00 PM PDT (London Start)
    # 21:00 UTC is 2:00 PM PDT (NY Close)
    # This covers the high-volume hours for XAU, BTC, and Forex
    - cron: '0 6-21 * * *'
  workflow_dispatch: # Allows you to manually trigger a scan from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up subsequent runs by caching pandas/numpy

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pandas_ta twelvedata requests

      - name: Run MFBS Scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          # The NTFY_TOPIC is already in your code, but you could also secret-ize it here
        # 'timeout 300s' kills the process at 5 minutes to prevent infinite hangs
        # '|| true' keeps the workflow "Green" even if the market is closed or no trades are found
        run: timeout 300s python bot.py || true
