name: MFBS Logic Scanner

on:
  schedule:
    # 06:00 UTC is 11:00 PM PDT (London Start)
    # 21:00 UTC is 2:00 PM PDT (NY Close)
    # This runs every hour at the 0 minute mark during those hours
    - cron: '0 6-21 * * *'
  workflow_dispatch: # Allows you to run it manually to test the connection

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pandas_ta twelvedata requests

      - name: Run MFBS Scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        # Assuming your file is named bot.py
        # '|| true' ensures the workflow stays green even if the script exits on a lull
        run: python bot.py || true
