name: MFBS Logic Scanner

on:
  schedule:
    # 06:00 UTC is 11:00 PM PDT (London Start)
    # 21:00 UTC is 2:00 PM PDT (NY Close)
    - cron: '0 6-21 * * *'
  workflow_dispatch: # Allows you to manually trigger a scan

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pandas_ta twelvedata requests

      - name: Run MFBS Scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        # Make sure your python file is actually named bot.py!
        run: timeout 300s python bot.py || true
