name: MFBS Logic Scanner

on:
  schedule:
    # Runs every hour at the 0 minute mark
    # 06:00 UTC to 21:00 UTC covers 11:00 PM to 2:00 PM Las Vegas (PDT)
    - cron: '0 6-21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pandas_ta twelvedata requests

      - name: Run MFBS Scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        # Added '|| true' so the workflow doesn't show a "Failed" red X 
        # if the bot simply finds no trades.
        run: python bot.py || true
